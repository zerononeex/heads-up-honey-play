<!doctype html>
<html lang="en" data-skin="midnight">
<head>
<meta charset="utf-8">
<title>Heads-Up Honey</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Heads-Up Honey">
<meta name="theme-color" content="#221A14">
<style>
/* Skins = custom properties switched by <html data-skin>. --ink text, --chip surface, --on accent/selected,
   --f1..4 flow shading (deepens with flow), --match filter ring, --hatch predicted-window stripes. */
:root{color-scheme:dark;--bg:#221A14;--ink:#FFF7E6;--mute:#CBB79E;--line:#4A3A2D;--chip:#2E231B;--on:#F59E0B;--onink:#221A14;
  --f1:#4E2534;--f2:#6C2A40;--f3:#8B2E4A;--f4:#B03A60;--onflow:#FFF7E6;--match:#F59E0B;--matchbg:#4A3418;
  --hatch:rgba(255,247,230,.22);--warn:#F2A0B0}
:root[data-skin="cream"]{color-scheme:light;--bg:#FFF7E6;--ink:#3B2A1A;--mute:#8A7258;--line:#EADBC0;--chip:#FFFDF8;--on:#D97706;--onink:#FFFDF8;
  --f1:#F6D3DD;--f2:#E8A0B4;--f3:#D97A95;--f4:#C14A6E;--onflow:#fff;--match:#D97706;--matchbg:#FDE7C2;
  --hatch:rgba(59,42,26,.18);--warn:#A33}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
/* ponytail: no document-level bounce, so nothing (header included) can be dragged up under the status bar; only the inner regions scroll */
html,body{height:100%;overscroll-behavior:none;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font:14px/1.3 -apple-system,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:0 8px}
/* Solid top underlay: iOS 26's glass status bar blurs whatever is behind it, so this non-scrolling first row holds the top
   safe area in flat skin colour and every scroll region starts below it. */
#top{flex:none;margin:0 -8px;padding-top:calc(env(safe-area-inset-top) + 6px);background:var(--bg)}
header{display:flex;align-items:center;gap:10px;min-height:52px}
header b{display:block;font-size:17px}
/* fixed square box: swapping the pot image never shifts the header */
.pot{position:relative;flex:none;width:56px;height:56px}
.pot img,.pot .honey{display:block;width:100%;height:100%}
/* pot motion: used only by the motion script below */
.pot .honey{position:absolute;inset:0;pointer-events:none}
.pot .honey g{transition:transform .7s cubic-bezier(.3,1.9,.5,1)}
.pot img.pour{animation:pour .18s ease-in-out 8 alternate}
@keyframes pour{from{transform:scale(1.06) rotate(-4deg)}to{transform:scale(1.06) rotate(4deg)}}
.pot .bee{position:absolute;left:0;top:0;width:14px;height:14px;pointer-events:none;animation:fly 2.5s ease-in-out forwards}
@keyframes fly{0%{transform:translate(-18px,34px);opacity:0}12%{opacity:1}30%{transform:translate(8px,-10px)}55%{transform:translate(50px,-6px) scaleX(-1)}
  75%{transform:translate(62px,30px) scaleX(-1)}90%{opacity:1}100%{transform:translate(20px,58px);opacity:0}}
header small{color:var(--mute);font-size:12px}
#v-cal{flex:1;min-height:0;display:flex;flex-direction:column}
#panel{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--line);margin-top:4px;padding:6px 0 12px}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.ph b{font-size:15px}
.logged{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.row{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.lbl{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
.chip,.seg{padding:5px 9px;border-radius:14px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);font-size:13px}
.chip.on,.seg.on{background:var(--on);color:var(--onink);font-weight:600}
.seg{border-radius:6px;flex:1;padding:6px 2px;text-align:center}
button:disabled{opacity:.4}
/* ponytail: circles are drawn ~28px for density but each button is a full-width slice 42px tall, so the
   hit area meets Apple's 44pt guideline in height and is ~1/10 row wide; upgrade = bigger circles if misses happen */
.mood{display:flex;margin:2px 0}
.mood button{flex:1;height:42px;display:flex;align-items:center;justify-content:center}
.mood span{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px}
.mood .on span{background:var(--on);color:var(--onink)}
.peri-h{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
/* timeline: one thin line down the left, a hollow node per stop (accent-filled once that stop has anything logged) */
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:4.25px;top:10px;bottom:14px;width:1.5px;background:var(--mute);opacity:.5}
.stop{position:relative}
.stop::before{content:'';position:absolute;left:-18px;top:7px;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--mute);background:var(--bg)}
.stop.on::before{background:var(--on);border-color:var(--on)}
.peri-h button{font-size:13px;color:var(--mute);padding:6px 0}
.sub{font-size:11px;color:var(--mute);width:100%;margin-top:2px}
.view{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px}
.view h2{font-size:16px;margin:4px 0 6px}
.view p{color:var(--mute);font-size:13px;margin:4px 0}
.strip-head{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.strip-head button{width:36px;height:30px;font-size:18px}
.strip{width:100%;height:auto;display:block}
.clist{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.clist td,.clist th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.clist th{font-size:11px;color:var(--mute);font-weight:400}
.clist tr.on td{font-weight:700}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 4px;font-size:10px;color:var(--mute)}
nav button.on{color:var(--ink);font-weight:600}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.back{font-size:13px;padding:4px 0;color:var(--match)}
#q{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--chip)}
.sum{font-weight:600;margin:8px 0 4px}
.res{display:block;width:100%;text-align:left;padding:6px 2px;border-bottom:1px solid var(--line)}
.res small{display:block;color:var(--mute)}
.mhead{font-size:11px;color:var(--mute);text-transform:uppercase;margin-top:8px}
.set{margin:12px 0}
.set .row .seg{flex:1}
.view .warn{color:var(--warn)}
#banner{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:8px;padding:6px 8px;margin:2px 0 4px;font-size:13px}
#banner [data-checkin]{flex:1;text-align:left}
#banner .x{color:var(--mute);font-size:12px;white-space:nowrap}
.mood.flash{outline:2px solid var(--ink);border-radius:8px}
#note{width:100%;margin-top:4px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--chip);color:inherit;font:inherit}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0}
.cal-head b{font-size:14px}
.cal-head button{width:36px;height:30px;font-size:18px}
/* month stack: its own scroll region, exactly one 6-week month tall (249px measured); the Today pill floats over its bottom-right */
.calwrap{position:relative;flex:none}
#cal{position:relative;height:250px;overflow-y:auto}
#today{position:absolute;right:6px;bottom:6px;padding:5px 12px;border-radius:14px;background:var(--on);color:var(--onink);font-size:12px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .dow{font-size:10px;color:var(--mute);text-align:center}
.cal .d{position:relative;height:34px;border-radius:6px;font-size:13px;text-align:center}
.cal .d.today{font-weight:700;text-decoration:underline}
.cal .d.m{background-color:var(--matchbg);box-shadow:inset 0 0 0 3px var(--match);font-weight:700}
.cal .d.f1{background:var(--f1)}.cal .d.f2{background:var(--f2)}.cal .d.f3{background:var(--f3);color:var(--onflow)}.cal .d.f4{background:var(--f4);color:var(--onflow)}
.cal .d.pw{background-image:repeating-linear-gradient(135deg,transparent 0 4px,var(--hatch) 4px 6px)}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .d i{position:absolute;top:1px;right:3px;font-size:9px;font-style:normal;opacity:.8}
</style>
</head>
<body>
<main id="app">
  <div id="top"></div>
  <section id="v-cal">
    <button class="back" id="back" data-view="filter" hidden>‹ Back to filter</button>
    <header id="hdr"><div class="pot" id="pot"><img id="potImg" width="56" height="56" alt=""></div><div id="hdrText"></div></header>
    <div id="banner" hidden><button data-checkin>Evening check-in — if it comes up naturally, grab a mood out of 10.</button><button class="x" data-week>Don’t ask this week</button><button class="x" data-dismiss aria-label="Dismiss">✕</button></div>
    <div class="calwrap"><div id="cal"></div><button id="today" data-today>Today</button></div>
    <div id="panel"></div>
  </section>
  <section id="v-filter" class="view" hidden>
    <input id="q" type="search" placeholder="Search tags and notes" autocomplete="off">
    <div id="f-body"></div>
  </section>
  <section id="v-cycles" class="view" hidden></section>
  <section id="v-settings" class="view" hidden></section>
  <nav>
    <button data-view="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
    <button data-view="filter"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>Filter</button>
    <button data-view="cycles"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.3"/><path d="M20 4v5h-5"/></svg>Cycles</button>
    <button data-view="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
  </nav>
</main>
<script>
const KEY = 'heads-up-honey-data-v1';
// Per-device UI prefs live in their own key: never in the data store, never in export/import.
const UI_KEY = 'heads-up-honey-ui-v1';
const SKINS = { midnight: ['Honey Midnight', '#221A14'], cream: ['Honey Cream', '#FFF7E6'] }; // label, theme-color
const FLOWS = ['None', 'Spotting', 'Light', 'Medium', 'Heavy'];
// Fixed v1 chip sets (no editor by design). Field name -> [heading, items]; perimeno items carry subgroup headings.
const GROUPS = [
  ['moodWords', 'Mood words', ['Calm', 'Happy', 'Irritable', 'Sad', 'Tired', 'Sensitive', 'Moody', 'Stressed', 'Cranky', 'Emotional']],
  ['feelings', 'Feelings', ['Overwhelmed', 'Frustrated', 'Lonely', 'Supported', 'Loved', 'Confident', 'Relaxed', 'On edge']],
  ['symptoms', 'Body', ['Cramps', 'Headache', 'Backache', 'Nausea', 'Fatigue', 'Hot flashes', 'Dizzy', 'Cravings', 'Tender', 'Sore joints']],
  ['energyDay', 'Energy & day', ['Energy high', 'Energy low', 'Slept badly', 'Exercised', 'Painkillers taken']],
];
const PERI = [
  ['Heat & sleep', ['Night sweats', 'Cold flashes / clammy', 'Trouble sleeping']],
  ['Mind', ['Brain fog', 'Forgetfulness', 'Trouble concentrating', 'Mood swings', 'Low mood']],
  ['Body', ['Muscle aches', 'Dry skin', 'Itchy skin', 'Hair thinning', 'Palpitations', 'Restless legs', 'UTIs', 'Urinary urgency']],
  ['Cycle', ['Irregular periods', 'Heavier flow', 'Lighter flow', 'Longer cycle', 'Shorter cycle', 'Skipped period', 'Spotting between periods', 'Clotting']],
  ['Sensitive', ['Vaginal dryness', 'Reduced libido', 'Weight gain']],
];
const TAGS = Object.fromEntries([...GROUPS.map(([f, , items]) => [f, items]), ['perimeno', PERI.flatMap(g => g[1])]]);

// ---- dates: ISO "YYYY-MM-DD" strings everywhere; UTC math so DST never shifts a day
const D = s => Date.UTC(+s.slice(0, 4), s.slice(5, 7) - 1, +s.slice(8, 10));
const iso = t => new Date(t).toISOString().slice(0, 10);
const addDays = (s, n) => iso(D(s) + n * 864e5);
const diffDays = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const todayISO = () => { const d = new Date(); return iso(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); };
const nDays = n => n + (n === 1 ? ' day' : ' days');
const fmt = (s, o = { month: 'short', day: 'numeric' }) => new Date(D(s)).toLocaleDateString('en-US', { timeZone: 'UTC', ...o });

// ---- storage
const blankEntry = () => ({ flow: 0, moodScore: null, moodWords: [], feelings: [], symptoms: [], energyDay: [], perimeno: [], note: '', source: 'tap' });
const isEmpty = e => !e.flow && e.moodScore == null && !e.note && Object.keys(TAGS).every(f => !e[f].length);
const blankStore = () => ({ version: 1, days: {}, settings: { moodCheckMode: 'window', moodCheckPausedUntil: null }, predictions: [] });
// Migration guard: every future shape change adds a step here; unknown versions are refused, never overwritten.
function migrate(s) {
  if (s && s.version === 1) return s;
  throw new Error('Unknown data version ' + (s && s.version));
}

// ---- calendar (one render path: every month of the Calendar stack, and the Filter screen's month, which alone keeps the ‹ › pager)
function calHTML(ym, o) {
  const first = ym + '-01', start = addDays(first, -new Date(D(first)).getUTCDay());
  let h = 'SMTWTFS'.split('').map(c => `<div class="dow">${c}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    if (i >= 35 && d.slice(0, 7) !== ym) break;
    if (d.slice(0, 7) !== ym) { h += '<div></div>'; continue; }
    const e = o.days[d] || {}, c = ['d'];
    if (e.flow) c.push('f' + e.flow);
    if (o.win && o.win.windowStart <= d && d <= o.win.windowEnd) c.push('pw');
    if (d === o.today) c.push('today');
    if (d === o.selected) c.push('sel');
    if (o.match && o.match.has(d)) c.push('m');
    h += `<button class="${c.join(' ')}" data-date="${d}">${+d.slice(8)}${e.moodScore ? `<i>${e.moodScore}</i>` : ''}</button>`;
  }
  const b = `<b>${fmt(first, { month: 'long', year: 'numeric' })}</b>`;
  return `<div class="cal-head">${o.pager ? `<button data-month="-1" aria-label="Previous month">‹</button>${b}<button data-month="1" aria-label="Next month">›</button>` : b}</div><div class="cal">${h}</div>`;
}
// Calendar screen: a vertical stack of months, all in the DOM at once (small grids, no lazy loading).
// Window = 12 months back (or the first logged month, if earlier) through 24 ahead, so history is never cut off.
const monthsBetween = (a, b) => (b.slice(0, 4) - a.slice(0, 4)) * 12 + (b.slice(5, 7) - a.slice(5, 7));
const ymAt = (ym, n) => iso(Date.UTC(+ym.slice(0, 4), ym.slice(5, 7) - 1 + n, 1)).slice(0, 7);
function stackMonths(days, today) {
  const back = ymAt(today, -12), first = Object.keys(days).sort()[0], start = first && first < back ? first.slice(0, 7) : back;
  return [...Array(monthsBetween(start, today) + 25)].map((_, i) => ymAt(start, i));
}
// ponytail: a date outside the stack clamps to its first/last month (its day panel still opens)
const monthIndex = (d, days, today) => { const m = stackMonths(days, today); return Math.max(0, Math.min(m.length - 1, monthsBetween(m[0], d))); };
const stackHTML = o => stackMonths(o.days, o.today).map(ym => `<div class="mon">${calHTML(ym, o)}</div>`).join('');
const shiftMonth = (ym, n) => addDays(ym + '-15', n * 30.5 | 0).slice(0, 7); // ponytail: mid-month + ~30.5d always lands in the adjacent month

// ---- period days: a start is flow>=1 with no flow the day before; an end is flow>=1 with none the day after
const flowOf = (days, d) => (days[d] || {}).flow || 0;
const isStart = (days, d) => flowOf(days, d) > 0 && !flowOf(days, addDays(d, -1));
const isEnd = (days, d) => flowOf(days, d) > 0 && !flowOf(days, addDays(d, 1));
// ponytail: Started/Ended write flow Medium on empty days (Ended fills back to the start, max 14 days); adjust per day with the flow control
function periodTap(days, d, which) {
  const set = (x, f) => { days[x] = { ...blankEntry(), ...days[x], flow: f }; };
  if (which === 'start' ? isStart(days, d) : isEnd(days, d)) return set(d, 0);
  if (which === 'start') return set(d, flowOf(days, d) || 3);
  let s = d;
  for (let i = 1; i <= 14; i++) if (flowOf(days, addDays(d, -i))) { s = addDays(d, 1 - i); break; }
  for (let x = s; x <= d; x = addDays(x, 1)) set(x, flowOf(days, x) || 3);
}

// ---- prediction (period-start window only; no ovulation/fertility in v1)
const periodStarts = days => Object.keys(days).sort().filter(d => isStart(days, d));
// ponytail: even counts round the mean of the two middle values to a whole day (no decimals anywhere in v1)
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2); };
function predict(starts) {
  const lens = starts.slice(1).map((s, i) => diffDays(starts[i], s)).slice(-6);
  if (lens.length < 2) return null; // still learning: never invent a 28-day default
  const med = median(lens), spread = Math.min(4, Math.max(1, Math.round((Math.max(...lens) - Math.min(...lens)) / 2)));
  const c = addDays(starts.at(-1), med);
  return { forCycleStart: starts.at(-1), windowStart: addDays(c, -spread), windowEnd: addDays(c, spread), medianUsed: med, cyclesUsed: lens.length };
}
// Frozen log: when a new latest start appears, append its prediction once from data available now; never edit it later.
function freezePrediction(st, today) {
  const starts = periodStarts(st.days), last = starts.at(-1);
  if (!last || st.predictions.some(p => p.forCycleStart === last)) return;
  const p = predict(starts);
  if (p) st.predictions.push({ madeOn: today, ...p });
}
const currentPrediction = st => { const starts = periodStarts(st.days); return st.predictions.find(p => p.forCycleStart === starts.at(-1)) || predict(starts); };
const range = p => `${fmt(p.windowStart)} – ${fmt(p.windowEnd)}`;
// Header state. Discreet by design: nothing returned here says "period".
// ponytail: "in a cycle's bleed" = today is logged with flow in the latest run; an unlogged today reads as the next cycle
function status(st, today) {
  const days = st.days, last = periodStarts(days).at(-1), p = currentPrediction(st);
  let end = last;
  while (end && flowOf(days, addDays(end, 1))) end = addDays(end, 1);
  if (last && last <= today && today <= end) return { state: 'period', line1: 'Day ' + (diffDays(last, today) + 1), line2: p ? 'Next expected ' + range(p) : '' };
  if (!p) return { state: 'far', line1: 'Still learning', line2: '' };
  const du = diffDays(today, p.windowStart), line2 = 'Expected ' + range(p);
  if (du >= 1) return { state: du > 10 ? 'far' : du >= 5 ? 'approaching' : 'close', days: du, line1: 'T-minus ' + nDays(du), line2 };
  // ponytail: after the window ends with nothing logged the pot stays full; no "late" alarm copy
  return today <= p.windowEnd ? { state: 'window', days: du, line1: 'In the window', line2 } : { state: 'past', days: du, line1: 'Window passed', line2 };
}

// Header pot: 17 finished images, one shown at a time. 0 = no start logged; 1-15 = ceil(cycle day / 2), held at 15;
// 16 = overflow from the predicted window's first day until a new start is logged. Still learning = never 16.
function potLevel(st, today) {
  const last = periodStarts(st.days).filter(d => d <= today).at(-1), p = currentPrediction(st);
  if (!last) return 0;
  if (p && p.forCycleStart === last && today >= p.windowStart) return 16;
  return Math.min(15, Math.ceil((diffDays(last, today) + 1) / 2));
}
const potFile = l => `assets/pots/pot-${String(l).padStart(2, '0')}.webp`;
const potAlt = l => l === 0 ? 'Empty honey pot' : l === 16 ? 'Overflowing honey pot' : `Honey pot, level ${l} of 15`;
let potView = potFile; // the motion script swaps this to show a honey-free base under its sloshing layer
// Home Screen badge = days until the window (1-9). Silently no-ops where unsupported.
// ponytail: inside the window the badge is a plain dot (setAppBadge() with no count) until a start is logged or the window passes
function badge(h) {
  try {
    if (!('setAppBadge' in navigator)) return;
    const r = h.days >= 1 && h.days <= 9 ? navigator.setAppBadge(h.days) : h.state === 'window' ? navigator.setAppBadge() : navigator.clearAppBadge();
    Promise.resolve(r).catch(() => {});
  } catch (e) { /* unsupported */ }
}

// ---- cycles: start -> next start; the latest cycle is open (length null)
function cycles(days) {
  const starts = periodStarts(days);
  return starts.map((start, i) => {
    let n = 1;
    while (flowOf(days, addDays(start, n))) n++;
    return { start, next: starts[i + 1] || null, length: starts[i + 1] ? diffDays(start, starts[i + 1]) : null, periodLen: n };
  });
}
// trailing 3-day mean of whatever scores exist in the window (drawn as a line only; never shown as a number)
const rolling = sc => sc.map((_, i) => { const w = sc.slice(Math.max(0, i - 2), i + 1).filter(x => x != null); return w.length ? w.reduce((a, b) => a + b) / w.length : null; });
const W = 340, X0 = 18; // strip geometry: mood axis 1-10 on top (y 6..66), flow bars below (y 72..96)
const moodY = v => 6 + (10 - v) * 60 / 9;

    const r = parseImport(await ev.target.files[0].text());
    sui.msg = r.error || '';
    if (r.data && (hasData(store) || readOnly)) sui.pendingImport = r.data; // second, explicit tap required before replacing
    else if (r.data) { store = r.data; save(); sui.msg = 'Backup imported.'; }
    render();
  });
  document.addEventListener('input', ev => {
    if (ev.target.id === 'q') { filt.q = ev.target.value; return render(); }
    if (ev.target.id !== 'note') return;
    edit(e => e.note = ev.target.value);
    ev.target.closest('.stop').classList.toggle('on', !!ev.target.value);
    $('logged').textContent = summary({ ...blankEntry(), ...store.days[ui.selected] });
  });
  render();
}
if (typeof document !== 'undefined') init();
</script>
<script>
// Pot motion: optional; deleting this whole script leaves the header pot working as a still image.
// Nothing moves unless Settings > Pot motion is on, motion access was allowed, and the phone isn't set to reduce motion.
// Slosh: levels 1-15 show the honey-free base plus a code-drawn honey layer clipped to the traced inside of the pot
// (art handoff: 1600px space, surface Y = 1369 - level/15 * 574); the surface stays level as the phone tilts.
(() => {
  const IN = 'M509 729L489 754L468 779L449 804L435 829L424 854L415 879L409 904L404 929L401 954L401 979L402 1004L406 1029L410 1054L416 1079L425 1104L434 1129L445 1154L459 1179L474 1204L491 1229L513 1254L536 1279L565 1304L583 1329L637 1354L760 1369L836 1369L961 1354L1016 1329L1035 1304L1063 1279L1088 1254L1109 1229L1127 1204L1142 1179L1156 1154L1167 1129L1177 1104L1185 1079L1191 1054L1196 1029L1199 1004L1200 979L1199 954L1197 929L1192 904L1186 879L1177 854L1165 829L1151 804L1134 779L1113 754L1093 729Z';
  const wall = [...IN.matchAll(/(\d+) (\d+)/g)].map(m => [+m[1], +m[2]]).filter(([x]) => x < 800); // left wall, for the streak
  const reduce = matchMedia('(prefers-reduced-motion: reduce)'), pot = $('pot'), img = $('potImg');
  let allowed = !!window.DeviceOrientationEvent && !DeviceOrientationEvent.requestPermission, angle = 0, lastShake = 0;
  const live = () => allowed && loadUI().motion && !reduce.matches;
  const calShowing = () => !document.hidden && !$('v-cal').hidden;
  pot.insertAdjacentHTML('beforeend', `<svg class="honey" viewBox="0 0 1600 1600" hidden aria-hidden="true"><clipPath id="potIn"><path d="${IN}"/></clipPath><g clip-path="url(#potIn)"><g id="honey"></g></g></svg>`);
  const svg = pot.querySelector('.honey'), g = $('honey');
  function draw(l) {
    svg.toggleAttribute('hidden', !l);
    if (!l) return;
    const Y = 1369 - l / 15 * 574, wave = [];
    for (let x = -600; x <= 2200; x += 20) wave.push(`${x} ${(Y + 13 * Math.sin(2 * Math.PI * (x - 470) / 280)).toFixed(1)}`);
    const wx = wall.reduce((a, b) => Math.abs(b[1] - Y - 42) < Math.abs(a[1] - Y - 42) ? b : a)[0] + 70;
    g.style.transformOrigin = `800px ${Y}px`;
    g.innerHTML = `<path d="M${wave.join('L')}L2200 3400L-600 3400Z" fill="#F59B0A"/><path d="M${wave.join('L')}" fill="none" stroke="#592C0B" stroke-width="23"/>`
      + (1369 - Y > 110 ? `<rect x="${wx}" y="${Y + 29}" width="${Math.min(170, 800 - wx)}" height="26" rx="13" fill="#F5AF3E"/>` : '');
  }
  const base = l => l < 5 ? potFile(0) : `assets/pots/base-${l < 10 ? '1bee' : '2bees'}.webp`; // bees match the baked states
  potView = l => live() && l >= 1 && l <= 15 ? (draw(l), base(l)) : (draw(0), potFile(l));
  // ponytail: left-right lean only (gamma, portrait); a phone tipped flat or landscape just reads as less tilt
  addEventListener('deviceorientation', e => {
    if (!live() || !calShowing() || e.gamma == null) return;
    const a = Math.max(-25, Math.min(25, -e.gamma));
    if (Math.abs(a - angle) < 1) return;
    g.style.transform = `rotate(${angle = a}deg)`;
  });
  // Shake only matters when overflowing: a 1.5s "pouring harder" jiggle, at most once every 2.5s.
  addEventListener('devicemotion', e => {
    const a = e.acceleration || {}, m = Math.hypot(a.x || 0, a.y || 0, a.z || 0), now = Date.now();
    if (m < 14 || now - lastShake < 2500 || !live() || !calShowing() || img.dataset.level !== '16') return;
    lastShake = now; img.classList.add('pour'); setTimeout(() => img.classList.remove('pour'), 1500);
  });
  // Bee cameo: about every 10s one small bee loops past the pot, skipped when the art already has bees (levels 5-16).
  setInterval(() => {
    if (!live() || !calShowing() || +img.dataset.level >= 5) return;
    pot.insertAdjacentHTML('beforeend', '<svg class="bee" viewBox="0 0 14 14" aria-hidden="true"><ellipse cx="5" cy="3.5" rx="2.6" ry="2" fill="#fff" opacity=".85"/><ellipse cx="7" cy="8" rx="5" ry="3.8" fill="#F5B528" stroke="#3B2A1A" stroke-width="1"/><path d="M6 4.5v7M8.6 4.6v6.8" stroke="#3B2A1A" stroke-width="1.3"/></svg>');
    pot.lastChild.addEventListener('animationend', ev => ev.target.remove());
  }, 10000);
  // iOS only grants motion from a tap: the Settings "On" tap asks; a saved "On" re-asks on the first tap of a launch.
  // A refusal turns the setting off, so the phone is never asked again unless the person taps On.
  function ask() {
    const req = [window.DeviceOrientationEvent, window.DeviceMotionEvent].filter(E => E && E.requestPermission).map(E => E.requestPermission());
    Promise.all(req).then(r => r.every(x => x === 'granted'), () => false).then(ok => {
      allowed = ok && !!window.DeviceOrientationEvent;
      if (!allowed) { saveUI({ motion: false }); sui.msg = 'Motion access wasn’t allowed, so the pot stays still. To use it, allow motion in the phone’s settings, then turn Pot motion on again.'; }
      render();
    });
  }
  document.addEventListener('click', e => { if (e.target.closest('[data-motion="1"]')) ask(); });
  if (loadUI().motion && !allowed && window.DeviceOrientationEvent) document.addEventListener('click', () => { if (loadUI().motion) ask(); }, { once: true });
  reduce.addEventListener('change', render);
  render();
})();
</script>
